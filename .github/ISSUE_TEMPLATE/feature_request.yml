name: 改进建议
description: 提出教学、研究或工程方面的改进建议
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这项修改希望解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明预期效果、取舍与备选方案。
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 使用范围确认
      options:
        - label: 本建议用于获得授权的安全研究或防御用途。
          required: true
