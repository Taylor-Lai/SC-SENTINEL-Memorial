# 比赛归档：停止定期版本升级 PR，保留配置供后续手动恢复。
version: 2
updates:
  - package-ecosystem: pip
    directory: /code/sentinel_backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /code/sentinel_agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /code/sentinel_frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /code/sentinel_backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /code/sentinel_agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /code/sentinel_frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
