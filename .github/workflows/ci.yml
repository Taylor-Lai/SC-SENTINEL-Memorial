name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: Archive integrity and navigation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check original code and local documentation links
        run: python scripts/check_archive.py

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r code/sentinel_backend/requirements.txt pytest pytest-asyncio
      - name: Run backend tests
        working-directory: code/sentinel_backend
        run: python -m pytest tests -q

  agent:
    name: Agent tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Agent test dependencies
        run: python -m pip install -r code/sentinel_agent/requirements.txt pytest
      - name: Run Agent tests
        working-directory: code/sentinel_agent
        run: python -m pytest tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/sentinel_frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: code/sentinel_frontend
        run: npm ci
      - name: Build frontend
        working-directory: code/sentinel_frontend
        run: npm run build
